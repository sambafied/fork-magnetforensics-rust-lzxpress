name: Release

on:
  push:
    tags:
      - "sambafied/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example sambafied/v0.2.0"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^sambafied/v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "tag must look like sambafied/v0.2.0" >&2
            exit 1
          fi
          echo "name=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --workspace --verbose

      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.name }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "tag ${tag} already exists" >&2
            exit 1
          fi
          git tag "$tag"
          git push origin "refs/tags/${tag}"

      - name: Package crates
        run: .github/scripts/package-release.sh "${{ steps.tag.outputs.name }}" "$RUNNER_TEMP/release"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          GitHub release of this fork at \`${RELEASE_TAG}\`.

          Depend on \`xpress_rs\` from this tag:

          \`\`\`toml
          xpress_rs = { git = "https://github.com/sambafied/fork-magnetforensics-rust-lzxpress", tag = "${RELEASE_TAG}" }
          \`\`\`

          The attached \`rust-lzxpress\` crate is the library from the same commit. This workflow does not publish either crate to crates.io.
          EOF
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release"/*.crate "$RUNNER_TEMP/release"/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --verify-tag \
            --notes-file "$notes"
